# Runs the production build locally with a real MongoDB:
#   docker compose up --build   →   http://localhost:4000
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - '4000:4000'
    environment:
      MONGODB_URI: mongodb://mongo:27017/influencer-crm
      CLIENT_ORIGIN: http://localhost:4000
      SEED_DEMO: 'true'
      # Local-only defaults. Real deployments must set their own long random secrets.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-compose-access-secret-0123456789abcdef}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-compose-refresh-secret-0123456789abcdef}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
